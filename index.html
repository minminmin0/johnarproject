<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지각대장 존 </title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 책장 넘기는 소리 -->
  <audio id="pageSound" src="sounds/paging.mp3" preload="auto"></audio>

  <!-- 동화책 화면 -->
  <div id="storybook">
    <img id="storyImage" src="images/story1.png" alt="동화 페이지">

    <!-- 이전 버튼 -->
    <button id="prevBtn" class="nav-btn left">
      <img src="images/prev.png" alt="이전">
    </button>

    <!-- 다음 버튼 -->
    <button id="nextBtn" class="nav-btn right">
      <img src="images/next.png" alt="다음">
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
