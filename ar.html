<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>GPS AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="ar-style.css">

  <script src="ar-script.js"></script>
</head>

<body>

  <!-- 위쪽: 시계 이미지만 -->
  <div id="clockPanel">
    <img id="clockImage" src="images/am830.png" alt="8시 30분">
  </div>

  <!-- 아래쪽: 멘트 -->
  <div id="messagePanel">
    <div id="storyText">
      악어가 길목을 서성이며 존의 앞을 막고 있습니다.<br>
      장갑을 던져 악어의 시선을 돌려보세요.
    </div>
  </div>

  <!-- 진행 버튼 -->
  <button id="actionBtn">장갑 던지기</button>

  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
    renderer="antialias: true; alpha: true"
  >

    <a-assets>
      <a-asset-item id="crocModel" src="models/crocodile.glb"></a-asset-item>
      <a-asset-item id="gloveModel" src="models/glove.glb"></a-asset-item>
      <a-asset-item id="gorillaTeacherModel" src="models/gorillaandteacher.glb"></a-asset-item>
    </a-assets>

    <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>

    <!-- 1번 위치: 뭉게네 / 악어 + 장갑 -->
    <a-entity
      id="crocPlace"
      gps-new-entity-place="latitude: 37.652734; longitude: 127.014713; maxDistance: 80"
    >

      <a-entity
        id="crocodile"
        gltf-model="#crocModel"
        position="0 0 -7"
        scale="4 4 4"
        rotation="0 180 0">
      </a-entity>

      <a-entity
        id="glove"
        gltf-model="#gloveModel"
        position="-1 0.7 -3"
        scale="1 1 1"
        rotation="0 30 0">
      </a-entity>

    </a-entity>

    <!-- 2번 위치: 쌍문제1동 / 고릴라에게 잡힌 선생님 -->
    <a-entity
      id="gorillaPlace"
      gps-new-entity-place="latitude: 37.650392; longitude: 127.013551; maxDistance: 80"
      visible="false"
    >

      <a-entity
        id="gorillaTeacher"
        gltf-model="#gorillaTeacherModel"
        position="0 1.5 -6"
        scale="2.5 2.5 2.5"
        rotation="0 180 0">
      </a-entity>

    </a-entity>

  </a-scene>

</body>
</html>
