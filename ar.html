<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GPS AR 고릴라 장면</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="ar-style.css">
</head>

<body>

  <div id="clockPanel">
    <img id="clockImage" src="images/am830.png" alt="8시 30분">
  </div>

  <div id="messagePanel">
    <div id="storyText">GPS 위치를 확인하는 중입니다...</div>
  </div>

  <a-scene
    id="arScene"
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false"
    renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true"
    webkit-playsinline
    playsinline
  >
    <a-assets>
      <a-asset-item id="gorillaTeacherModel" src="models/gorillaandteacher.glb"></a-asset-item>
    </a-assets>

    <a-camera gps-new-camera="gpsMinDistance: 1">
      <a-entity
        id="gorillaTeacher"
        gltf-model="#gorillaTeacherModel"
        position="0 -1 -6"
        scale="8 8 8"
        rotation="0 0 0"
        visible="false"
      ></a-entity>
    </a-camera>

  </a-scene>

  <script src="ar-script.js"></script>
</body>
</html>
