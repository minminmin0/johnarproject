<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GPS AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="ar-style.css">
</head>

<body>

  <div id="clockPanel">
    <img id="clockImage" src="images/am830.png" alt="8시 30분">
  </div>

  <div id="messagePanel">
    <div id="storyText">위치를 확인하는 중입니다...</div>
  </div>

  <button id="actionBtn" style="display: none;">
    <img id="actionBtnImg" src="images/throwglovebutton.png" alt="장갑 던지기">
  </button>

  <a-scene
    id="arScene"
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false"
    renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true"
    webkit-playsinline
    playsinline
  >
    <a-assets>
      <a-asset-item id="crocModel" src="models/crocodile.glb"></a-asset-item>
      <a-asset-item id="gloveModel" src="models/glove.glb"></a-asset-item>
      <a-asset-item id="gorillaTeacherModel" src="models/gorillaandteacher.glb"></a-asset-item>
    </a-assets>

    <a-camera gps-new-camera="gpsMinDistance: 5"></a-camera>

    <a-entity
      id="crocodile"
      gltf-model="#crocModel"
      gps-new-entity-place="latitude: 37.650197; longitude: 127.013888"
      scale="80 80 80"
      rotation="0 180 0"
      visible="false"
    ></a-entity>

    <a-entity
      id="glove"
      gltf-model="#gloveModel"
      gps-new-entity-place="latitude: 37.650197; longitude: 127.013888"
      scale="9 9 9"
      rotation="0 30 0"
      visible="false"
    ></a-entity>

    <a-entity
      id="gorillaTeacher"
      gltf-model="#gorillaTeacherModel"
      gps-new-entity-place="latitude: 37.650392; longitude: 127.013551"
      scale="2.5 2.5 2.5"
      rotation="0 180 0"
      visible="false"
    ></a-entity>

  </a-scene>

  <script src="ar-script.js"></script>
</body>
</html>
