<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GPS AR 악어 테스트</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="ar-style.css">
</head>

<body>

  <div id="clockPanel">
    <img id="clockImage" src="images/am830.png" alt="8시 30분">
  </div>

  <div id="messagePanel">
    <div id="storyText">위치를 확인하는 중입니다...</div>
  </div>

  <a-scene
    id="arScene"
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false"
    renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true"
    webkit-playsinline
    playsinline
  >
    <a-assets>
      <a-asset-item id="crocModel" src="models/crocodile.glb"></a-asset-item>
    </a-assets>

    <a-camera gps-new-camera="gpsMinDistance: 1"></a-camera>

    <a-entity
      id="crocodile"
      gltf-model="#crocModel"
      gps-new-entity-place="latitude: 37.652859; longitude: 127.016284"
      scale="20 20 20"
      rotation="0 180 0"
      visible="true"
    ></a-entity>

  </a-scene>

  <script src="ar-script.js"></script>
</body>
</html>
